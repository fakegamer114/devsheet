<!DOCTYPE html>
<html lang="en" dir="ltr"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cheatsheet for CSS selectors, layout and rules">
  <title>DevSheet - CSS Cheatsheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="python.css">
  <link rel="icon" href="download.png" type="image/png">
  <script src="node.js"></script>
</head>
<body>
    <header>
        
        
        <div class="logo">
            <div class="logo-icon" onclick="window.location.href='index.html'">&gt;_</div>
            <span class="logo-text" onclick="window.location.href='index.html'">DevSheet</span>
        </div><!--// sanding message warning when taping on the button that given by id openAppBtn-->
        
        <button class="open-btn" id="openAppBtn" onclick="openApp()">Open App</button>
    
    </header>
        <!--return back to the last page -->
        <button class="back-btn" onclick="goBack()">← Back</button>
        
        <!-- Search bar -->
        <input type="text" id="search-bar" placeholder="Search cheatsheets...">
        
        <h2>CSS Cheatsheet</h2>
        
        <!--cards for the sheatsheet withe favorating and copy ability-->
        <div class="cards-container">
            <div class="card">
                <h3>Selectors</h3>
                <p><code>p { color: red; }</code></p>
                <button class="copy-btn" onclick="copyToClipboard('p { color: red; }')">Copy</button>
            </div>
            <div class="card">
                <h3>Class/ID</h3>
                <p><code>.btn { }  #header { }</code></p>
                <button class="copy-btn" onclick="copyToClipboard('.btn { }  #header { }')">Copy</button>
            </div>
            <div class="card">
                <h3>Box Model</h3>
                <p><code>margin, padding, border</code></p>
                <button class="copy-btn" onclick="copyToClipboard('margin, padding, border')">Copy</button>
            </div>
            <div class="card">
                <h3>Flexbox</h3>
                <p><code>display: flex;</code></p>
                <button class="copy-btn" onclick="copyToClipboard('display: flex;')">Copy</button>
            </div>
            <div class="card">
                <h3>Grid</h3>
                <p><code>display: grid;</code></p>
                <button class="copy-btn" onclick="copyToClipboard('display: grid;')">Copy</button>
            </div>
            <div class="card">
                <h3>Media Query</h3>
                <p><code>@media (max-width: 600px) { ... }</code></p>
                <button class="copy-btn" onclick="copyToClipboard('@media (max-width: 600px) { ... }')">Copy</button>
            </div>
            <div class="card">
                <h3>Transition</h3>
                <p><code>transition: all 0.3s;</code></p>
                <button class="copy-btn" onclick="copyToClipboard('transition: all 0.3s;')">Copy</button>
            </div>
        </div>
        
    </body>
    <footer>
        <p>&copy; 2026 DevSheet. All rights reserved.</p> 
    </footer>
</html>
